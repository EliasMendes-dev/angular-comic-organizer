<div class="container-header">
  <app-menu-bar-logo></app-menu-bar-logo>
  <button
    class="menu-toggle"
    type="button"
    [attr.aria-expanded]="isMenuOpen()"
    aria-controls="primary-navigation"
    [attr.aria-label]="isMenuOpen() ? 'Fechar menu' : 'Abrir menu'"
    [class.is-open]="isMenuOpen()"
    (click)="toggleMenu()"
  >
    @if (isMenuOpen()) {
      <svg lucideX [size]="24"></svg>
    } @else {
      <svg lucideMenu [size]="24"></svg>
    }
  </button>

  <nav
    id="primary-navigation"
    class="primary-nav"
    [class.is-open]="isMenuOpen()"
    aria-label="Navegação principal"
  >
    <button class="menu-close" type="button" aria-label="Fechar menu" (click)="closeMenu()">
      <svg lucideX [size]="24"></svg>
    </button>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
    <a routerLink="/library" routerLinkActive="active" (click)="closeMenu()">Library</a>
    <a routerLink="/favorites" routerLinkActive="active" (click)="closeMenu()">Favorites</a>
    <a routerLink="/collections" routerLinkActive="active" (click)="closeMenu()">Collections</a>
    <a routerLink="/converter" routerLinkActive="active" (click)="closeMenu()">Converter</a>
    <a routerLink="/settings" routerLinkActive="active" (click)="closeMenu()">Settings</a>
  </nav>
</div>

<button
  class="menu-backdrop"
  type="button"
  aria-label="Fechar menu"
  [class.is-visible]="isMenuOpen()"
  (click)="closeMenu()"
></button>
