<div class="header-file-explorer">
  <div class="title-file-explorer">
    <svg lucideFolder class="svg-icon"></svg>
    <h2>Explorador de Arquivos</h2>
  </div>

  <div class="actions-file-explorer">
    <div class="format-selector-container">
      <button
        class="format-selector action-button"
        aria-label="Escolher tipo de conversão"
        (click)="isFormatMenuActive = !isFormatMenuActive"
      >
        <svg lucidePlus></svg>
        <svg lucideChevronDown></svg>
      </button>

      <div class="format-options" [class.active]="isFormatMenuActive">
        <button
          class="format-option"
          [class.inactive]="selectedConversion && selectedConversion !== 'cbr-to-cbz'"
          [disabled]="selectedConversion && selectedConversion !== 'cbr-to-cbz'"
          (click)="selectConversion('cbr-to-cbz')"
        >
          CBR para CBZ
        </button>
        <button
          class="format-option"
          [class.inactive]="selectedConversion && selectedConversion !== 'cbz-to-cbr'"
          [disabled]="selectedConversion && selectedConversion !== 'cbz-to-cbr'"
          (click)="selectConversion('cbz-to-cbr')"
        >
          CBZ para CBR
        </button>
      </div>
    </div>

    <button
      class="action-button chooseall"
      [class.active]="isActive"
      [disabled]="!hasItems"
      (mouseenter)="isHovering = true"
      (mouseleave)="isHovering = false"
      (click)="handleChooseAll()"
    >
      @if (!hasItems) {
        <svg lucideSquareX class="svg-icon disabled"></svg>
      } @else if (isHovering || isActive) {
        <svg lucideSquareCheckBig class="svg-icon"></svg>
      } @else {
        <svg lucideSquare class="svg-icon"></svg>
      }
    </button>

    <button class="action-button delete" (click)="handleDeleteAll()">
      <svg lucideTrash2 class="delete"></svg>
    </button>
  </div>
</div>
